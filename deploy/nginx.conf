# /etc/nginx/conf.d/speedtest.conf  – reverse proxy for the FurqanCloud speed test node
upstream speedtest { server 127.0.0.1:3000; keepalive 64; }

server {
    listen 80;
    server_name speed.furqancloud.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name speed.furqancloud.com;

    ssl_certificate     /etc/letsencrypt/live/speed.furqancloud.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/speed.furqancloud.com/privkey.pem;

    client_max_body_size 128m;

    # Test traffic: no buffering, no compression, no caching
    location ~ ^/(__down|__up|__ping|ping|meta) {
        proxy_pass http://speedtest;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        gzip off;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://speedtest;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
